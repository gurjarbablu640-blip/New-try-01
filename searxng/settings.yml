use_default_settings: true
general:
  debug: false
  instance_name: "Salesoorja Private Search"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "salesoorja_searxng_secret_key_2026"

# Public search pages can exceed the upstream 3-second default.
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0

# Google works for the public-person queries; CSE was timing out.
engines:
  - name: google
    disabled: false
  - name: google cse
    disabled: true
