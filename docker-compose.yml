services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  db:
    image: pgvector/pgvector:pg16

    container_name: salesoorja-db

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine

    container_name: salesoorja-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ============================================================
  # SEARXNG (Private Self-Hosted Search)
  # ============================================================

  searxng:
    image: searxng/searxng:latest
    container_name: salesoorja-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/


  # ============================================================
  # DEERFLOW BROWSER HARNESS MICROSERVICE
  # ============================================================

  deerflow:
    image: new-try-01-backend:latest
    container_name: salesoorja-deerflow
    restart: unless-stopped
    command: uvicorn deerflow_service.server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./deerflow_service:/app/deerflow_service

  # ============================================================
  # FASTAPI BACKEND
  # ============================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: salesoorja-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379/0

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      SEARXNG_BASE_URL: http://searxng:8080
      DEERFLOW_BASE_URL: http://deerflow:8001
      DEERFLOW_ENABLED: "true"
      LINKEDIN_MCP_ENABLED: ${LINKEDIN_MCP_ENABLED:-false}
      LINKEDIN_MCP_URL: ${LINKEDIN_MCP_DOCKER_URL:-http://host.docker.internal:8765/mcp}
      LINKEDIN_MCP_HOST_HEADER: ${LINKEDIN_MCP_HOST_HEADER:-127.0.0.1:8765}

      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}

      CORS_ORIGINS: ${CORS_ORIGINS}

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  # ============================================================
  # CELERY WORKER
  # ============================================================

  celery-worker:
    image: new-try-01-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salesoorja-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      SEARXNG_BASE_URL: http://searxng:8080
      DEERFLOW_BASE_URL: http://deerflow:8001
      DEERFLOW_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=2

  # ============================================================
  # CELERY BEAT
  # ============================================================

  celery-beat:
    image: new-try-01-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salesoorja-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A celery_app.celery_app beat --loglevel=info

  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: salesoorja-frontend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data:
  redis_data:
