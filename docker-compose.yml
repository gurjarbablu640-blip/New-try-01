services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  db:
    image: pgvector/pgvector:pg16
    container_name: salesoorja-db

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: salesoorja-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ============================================================
  # FASTAPI BACKEND
  # ============================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: salesoorja-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}

      CORS_ORIGINS: ${CORS_ORIGINS}

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "


  # ============================================================
  # CELERY WORKER
  # ============================================================

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: salesoorja-celery-worker

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}

      SECRET_KEY: ${SECRET_KEY}

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: celery -A celery_app:celery_app worker --loglevel=info --concurrency=2


  # ============================================================
  # CELERY BEAT
  # ============================================================

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: salesoorja-celery-beat

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN}

      SECRET_KEY: ${SECRET_KEY}

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    command: celery -A celery_app:celery_app beat --loglevel=info


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: salesoorja-frontend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


# ============================================================
# VOLUMES
# ============================================================

volumes:
  postgres_data:
  redis_data: