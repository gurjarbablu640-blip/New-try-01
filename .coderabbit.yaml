language: "en"
tone_instructions: "Concise, technically precise, and actionable"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: false
    drafts: false
  path_filters:
    - "!**/.env*"
    - "!**/backend/data/*.json"
    - "!**/deerflow_service/browser_profiles/**"
    - "!**/deerflow_service/challenges/**"
    - "!**/contact_research_runs/**"
    - "!**/backend/scratch/**"
    - "!**/*.exe"
    - "!**/*.key"
    - "!**/*.pem"
    - "!**/*.p12"
    - "!**/*.pfx"
    - "!**/*.token"
    - "!**/*secret*"
